name: Release draft

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-settings
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      chrome_basename: ${{ steps.release.outputs.chrome_basename }}
      firefox_source_basename: ${{ steps.release.outputs.firefox_source_basename }}
      firefox_zip_basename: ${{ steps.release.outputs.firefox_zip_basename }}
      version: ${{ steps.release.outputs.version }}
      vscode_basename: ${{ steps.release.outputs.vscode_basename }}

    steps:
      - name: Require immutable repository releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SETTINGS_JSON="$RUNNER_TEMP/pin-op-immutable-releases.json"
          test ! -e "$SETTINGS_JSON"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/immutable-releases" > "$SETTINGS_JSON"
          jq -e '.enabled == true' "$SETTINGS_JSON" > /dev/null

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify annotated tag and product versions
        id: release
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          TAG_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$TAG_COMMIT"
          git show-ref --verify --quiet refs/remotes/origin/master
          git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/master
          RELEASE_VERSION="$(node tools/verify-release-version.mjs "$RELEASE_TAG")"
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=pin-op-release-%s-run-%s\n' \
            "$RELEASE_TAG" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'vscode_basename=pin-op-vscode-%s.vsix\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'chrome_basename=pin-op-chrome-%s.zip\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'firefox_zip_basename=pin-op-firefox-%s.zip\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'firefox_source_basename=pin-op-firefox-source-%s.zip\n' \
            "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: corepack pnpm build

      - name: Run unit and release tests
        run: corepack pnpm test

      - name: Run VS Code Extension Host integration tests
        run: xvfb-run -a corepack pnpm test:integration

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Lint
        run: corepack pnpm lint

      - name: Lint Firefox extension
        run: corepack pnpm exec web-ext lint --source-dir extensions/firefox --ignore-files package.json pnpm-lock.yaml tsconfig.json esbuild.mjs "src/**" "test/**"

      - name: Test Chrome manifest and adapter
        run: corepack pnpm --filter pin-op-chrome test -- manifest.test.ts adapter.test.ts

      - name: Package unsigned artifacts
        run: corepack pnpm package

      - name: Check generated drift
        run: |
          git diff --check
          git diff --exit-code

      - name: Preserve immutable draft assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: |
            artifacts/${{ steps.release.outputs.vscode_basename }}
            artifacts/${{ steps.release.outputs.chrome_basename }}
            artifacts/${{ steps.release.outputs.firefox_zip_basename }}
            artifacts/${{ steps.release.outputs.firefox_source_basename }}
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  create_draft:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      CHROME_BASENAME: ${{ needs.package.outputs.chrome_basename }}
      FIREFOX_SOURCE_BASENAME: ${{ needs.package.outputs.firefox_source_basename }}
      FIREFOX_ZIP_BASENAME: ${{ needs.package.outputs.firefox_zip_basename }}
      VSCODE_BASENAME: ${{ needs.package.outputs.vscode_basename }}

    steps:
      - name: Restore verified draft assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: release-assets

      - name: Require the exact draft asset set
        run: |
          set -euo pipefail
          test -f "release-assets/$VSCODE_BASENAME"
          test -f "release-assets/$CHROME_BASENAME"
          test -f "release-assets/$FIREFOX_ZIP_BASENAME"
          test -f "release-assets/$FIREFOX_SOURCE_BASENAME"
          test -f release-assets/SHA256SUMS
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 5
          (cd release-assets && sha256sum --check --strict SHA256SUMS)

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "release-assets/$VSCODE_BASENAME" \
            "release-assets/$CHROME_BASENAME" \
            "release-assets/$FIREFOX_ZIP_BASENAME" \
            "release-assets/$FIREFOX_SOURCE_BASENAME" \
            "release-assets/SHA256SUMS" \
            --draft \
            --verify-tag \
            --target master \
            --title "Pin-op $RELEASE_TAG" \
            --generate-notes
