<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pin-op</title>
    <link rel="stylesheet" href="./panel.css" />
    <link rel="stylesheet" href="./devtools-elements.css" />
  </head>
  <body>
    <main class="panel-layout inspector-panel-layout">
      <div class="panel-toolbar-scroll">
        <header class="panel-toolbar" aria-label="Pin-op controls">
          <div id="toolbar-features" class="toolbar-features">
            <button id="inspect-mode" class="icon-button picker-button" type="button" aria-label="Select an element" aria-pressed="false" title="Select an element" disabled>
              <i data-lucide="mouse-pointer-2" aria-hidden="true"></i>
            </button>
            <button id="refresh-styles" class="icon-button" type="button" aria-label="Refresh styles" title="Refresh styles" disabled>
              <i data-lucide="refresh-cw" aria-hidden="true"></i>
            </button>
            <label class="setting-control">
              <input id="auto-refresh-enabled" type="checkbox" checked disabled />
              Auto Refresh
            </label>
            <label class="setting-control">
              <input id="ide-highlight-enabled" type="checkbox" checked disabled />
              IDE Highlight
            </label>
          </div>

          <div class="connection-summary">
            <output id="connection-status" class="status" data-state="notLinked">Not linked</output>
            <output id="linked-code" class="linked-code" hidden></output>
            <section id="link-controls" class="connection" aria-label="IDE link">
              <form id="link-form" class="link-form">
                <label class="visually-hidden" for="link-code">VS Code window code</label>
                <input id="link-code" type="text" inputmode="numeric" autocomplete="off" maxlength="9" spellcheck="false" aria-label="VS Code window code" />
                <button id="paste-button" class="icon-button" type="button" aria-label="Paste link code" title="Paste link code">
                  <i data-lucide="clipboard-paste" aria-hidden="true"></i>
                </button>
                <button id="link-button" class="primary-button" type="submit" disabled>Link</button>
              </form>
            </section>
            <button id="disconnect-button" class="disconnect-button" type="button" hidden>Disconnect</button>
          </div>
        </header>
      </div>

      <section id="protocol-mismatch" class="protocol-mismatch" role="alert" hidden>
        <strong>Extensions are incompatible</strong>
        <span>Update the Pin-op browser and IDE extensions to compatible versions, then reconnect.</span>
        <span id="protocol-mismatch-versions">Browser protocol: unknown - IDE protocol: unknown</span>
      </section>

      <section id="inspector-workspace" class="panel-workspace inspector-workspace" aria-label="Elements workspace">
        <div id="inspector-elements-mount" aria-label="Elements inspector mount"></div>
      </section>

      <div id="inspector-status" class="inspector-status" role="group" aria-label="Inspector status">
        <div id="operational-footer" class="operational-footer">
          <output id="selected-element-summary" class="selected-element-summary" hidden></output>
          <div class="resolution-row">
            <output id="resolution-status" class="resolution-status" role="status">Select an element to inspect</output>
          </div>
        </div>
        <output id="panel-error" class="panel-error" role="status" hidden></output>
      </div>

      <footer id="panel-credit" class="panel-credit">
        <small class="panel-credit-text">Pin-op by <a
            id="panel-credit-author"
            href="mailto:info@conus.vision"
            title="info@conus.vision"
          >Volodymyr Moskvin</a> © 2026 <a
            id="panel-credit-company"
            href="https://conus.vision"
            title="https://conus.vision"
            target="_blank"
            rel="noreferrer noopener"
          >Conus Vision</a></small>
      </footer>
    </main>
    <script type="module" src="./inspectorPanel.js"></script>
  </body>
</html>
