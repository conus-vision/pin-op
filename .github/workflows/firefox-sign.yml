name: Sign Firefox and publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (vX.Y.Z)
        required: true
        type: string
      resume_run_id:
        description: Prior approval-timeout or later sign run ID whose validated AMO upload should be resumed
        required: false
        default: ""
        type: string
      mode:
        description: Sign and attach XPI, or publish an installed-verified draft
        required: true
        default: sign
        type: choice
        options:
          - sign
          - publish
      sign_run_id:
        description: Completed trusted sign run ID required only for publish mode
        required: false
        default: ""
        type: string
      verified_xpi_sha256:
        description: Exact lowercase SHA-256 copied after testing that sign run XPI in Firefox Stable; required only for publish mode
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: firefox-sign-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: release-settings
    permissions:
      actions: read
      contents: read
    outputs:
      chrome_basename: ${{ steps.release.outputs.chrome_basename }}
      firefox_source_basename: ${{ steps.release.outputs.firefox_source_basename }}
      firefox_xpi_basename: ${{ steps.release.outputs.firefox_xpi_basename }}
      firefox_zip_basename: ${{ steps.release.outputs.firefox_zip_basename }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      release_database_id: ${{ steps.remote_release.outputs.release_database_id }}
      unsigned_artifact_name: ${{ steps.release.outputs.unsigned_artifact_name }}
      version: ${{ steps.release.outputs.version }}
      vscode_basename: ${{ steps.release.outputs.vscode_basename }}

    steps:
      - name: Require mode-specific trusted inputs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          MODE: ${{ inputs.mode }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          SIGN_RUN_ID: ${{ inputs.sign_run_id }}
          VERIFIED_XPI_SHA256: ${{ inputs.verified_xpi_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/master"
          if [[ "$MODE" = "sign" ]]; then
            test -z "$SIGN_RUN_ID"
            test -z "$VERIFIED_XPI_SHA256"
            if [[ -n "$RESUME_RUN_ID" ]]; then
              [[ "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            fi
          else
            test "$MODE" = "publish"
            test -z "$RESUME_RUN_ID"
            [[ "$SIGN_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$VERIFIED_XPI_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi

      - name: Require immutable repository releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SETTINGS_JSON="$RUNNER_TEMP/pin-op-immutable-releases.json"
          test ! -e "$SETTINGS_JSON"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/immutable-releases" > "$SETTINGS_JSON"
          jq -e '.enabled == true' "$SETTINGS_JSON" > /dev/null

      - name: Check out requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify checkout is the requested annotated release tag
        id: release
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          TAG_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$TAG_COMMIT"
          git show-ref --verify --quiet refs/remotes/origin/master
          git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/master
          RELEASE_VERSION="$(node tools/verify-release-version.mjs "$RELEASE_TAG")"
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'release_commit=%s\n' "$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'unsigned_artifact_name=pin-op-unsigned-release-%s-run-%s\n' \
            "$RELEASE_TAG" "$CURRENT_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'vscode_basename=pin-op-vscode-%s.vsix\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'chrome_basename=pin-op-chrome-%s.zip\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'firefox_zip_basename=pin-op-firefox-%s.zip\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'firefox_xpi_basename=pin-op-firefox-%s.xpi\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'firefox_source_basename=pin-op-firefox-source-%s.zip\n' \
            "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: corepack pnpm build

      - name: Run unit and release tests
        run: corepack pnpm test

      - name: Run VS Code Extension Host integration tests
        run: xvfb-run -a corepack pnpm test:integration

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Lint
        run: corepack pnpm lint

      - name: Lint Firefox extension
        run: corepack pnpm exec web-ext lint --source-dir extensions/firefox --ignore-files package.json pnpm-lock.yaml tsconfig.json esbuild.mjs "src/**" "test/**"

      - name: Test Chrome manifest and adapter
        run: corepack pnpm --filter pin-op-chrome test -- manifest.test.ts adapter.test.ts

      - name: Rebuild and verify unsigned artifacts
        run: corepack pnpm package

      - name: Check generated drift
        run: |
          git diff --check
          git diff --exit-code

      - name: Download current draft for validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/pin-op-validation-release"
          RELEASE_JSON="$RUNNER_TEMP/pin-op-validation-release.json"
          test ! -e "$RELEASE_DIR"
          test ! -e "$RELEASE_JSON"
          mkdir "$RELEASE_DIR"
          gh release download "$RELEASE_TAG" --dir "$RELEASE_DIR"
          gh release view "$RELEASE_TAG" --json databaseId,isDraft,assets > "$RELEASE_JSON"

      - name: Verify current draft identity and rebuilt bytes
        id: remote_release
        env:
          FIREFOX_XPI_BASENAME: ${{ steps.release.outputs.firefox_xpi_basename }}
          FIREFOX_ZIP_BASENAME: ${{ steps.release.outputs.firefox_zip_basename }}
          MODE: ${{ inputs.mode }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/pin-op-validation-release"
          RELEASE_JSON="$RUNNER_TEMP/pin-op-validation-release.json"
          if [[ "$MODE" = "sign" ]]; then
            RELEASE_DATABASE_ID="$(node tools/verify-release-assets.mjs unsigned \
              "$RELEASE_JSON" "$RELEASE_VERSION" "$RELEASE_DIR/SHA256SUMS" \
              --compare-all artifacts)"
          else
            RELEASE_DATABASE_ID="$(node tools/verify-release-assets.mjs signed \
              "$RELEASE_JSON" "$RELEASE_VERSION" "$RELEASE_DIR/SHA256SUMS" \
              --compare-unsigned-artifacts artifacts)"
            node tools/verify-signed-firefox.mjs \
              "$RELEASE_DIR/$FIREFOX_ZIP_BASENAME" \
              "$RELEASE_DIR/$FIREFOX_XPI_BASENAME" \
              "$RELEASE_VERSION" \
              "info@conus.vision"
          fi
          (cd "$RELEASE_DIR" && sha256sum --check --strict SHA256SUMS)
          printf 'release_database_id=%s\n' "$RELEASE_DATABASE_ID" >> "$GITHUB_OUTPUT"

      - name: Prepare immutable unsigned release bundle
        env:
          CHROME_BASENAME: ${{ steps.release.outputs.chrome_basename }}
          FIREFOX_SOURCE_BASENAME: ${{ steps.release.outputs.firefox_source_basename }}
          FIREFOX_ZIP_BASENAME: ${{ steps.release.outputs.firefox_zip_basename }}
          VSCODE_BASENAME: ${{ steps.release.outputs.vscode_basename }}
        run: |
          set -euo pipefail
          test ! -e release-bundle
          mkdir -p release-bundle/artifacts release-bundle/tools
          cp -- "artifacts/$VSCODE_BASENAME" release-bundle/artifacts/
          cp -- "artifacts/$CHROME_BASENAME" release-bundle/artifacts/
          cp -- "artifacts/$FIREFOX_ZIP_BASENAME" release-bundle/artifacts/
          cp -- "artifacts/$FIREFOX_SOURCE_BASENAME" release-bundle/artifacts/
          cp -- artifacts/SHA256SUMS release-bundle/artifacts/
          cp -- \
            tools/release-policy.mjs \
            tools/release-publishing.mjs \
            tools/release-signing-provenance.mjs \
            tools/verify-release-assets.mjs \
            tools/verify-publication-checksums.mjs \
            tools/verify-release-publication.mjs \
            tools/verify-release-version.mjs \
            tools/write-checksums.mjs \
            release-bundle/tools/

      - name: Preserve immutable unsigned release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.unsigned_artifact_name }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: validate
    if: ${{ needs.validate.result == 'success' && inputs.mode == 'sign' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: amo-signing
    permissions:
      actions: read
      contents: read
    outputs:
      signed_artifact_name: ${{ steps.artifact_names.outputs.signed_provenance_artifact_name }}
      xpi_sha256: ${{ steps.provenance.outputs.xpi_sha256 }}

    steps:
      - name: Check out requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Restore verified unsigned release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.unsigned_artifact_name }}
          path: release-bundle

      - name: Define signing artifact handoffs
        id: artifact_names
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          AMO_STATE_ARTIFACT_NAME="$(node tools/amo-signing-state.mjs artifact-name \
            "$RELEASE_TAG" "$CURRENT_RUN_ID")"
          SIGNED_PROVENANCE_ARTIFACT_NAME="$(node tools/release-signing-provenance.mjs artifact-name \
            "$RELEASE_TAG" "$CURRENT_RUN_ID")"
          RESUME_AMO_STATE_ARTIFACT_NAME=""
          if [[ -n "$RESUME_RUN_ID" ]]; then
            RESUME_AMO_STATE_ARTIFACT_NAME="$(node tools/amo-signing-state.mjs artifact-name \
              "$RELEASE_TAG" "$RESUME_RUN_ID")"
          fi
          printf 'amo_state_artifact_name=%s\n' "$AMO_STATE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          printf 'resume_amo_state_artifact_name=%s\n' \
            "$RESUME_AMO_STATE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          printf 'signed_provenance_artifact_name=%s\n' \
            "$SIGNED_PROVENANCE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          printf 'amo_state_directory_name=pin-op-amo-state\n' >> "$GITHUB_OUTPUT"
          printf 'signed_provenance_directory_name=pin-op-signed-xpi-provenance\n' \
            >> "$GITHUB_OUTPUT"

      - name: Redownload unsigned draft immediately before AMO
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/pin-op-signing-unsigned"
          RELEASE_JSON="$RUNNER_TEMP/pin-op-signing-unsigned.json"
          test ! -e "$RELEASE_DIR"
          test ! -e "$RELEASE_JSON"
          mkdir "$RELEASE_DIR"
          gh release download "$RELEASE_TAG" --dir "$RELEASE_DIR"
          gh release view "$RELEASE_TAG" --json databaseId,isDraft,assets > "$RELEASE_JSON"

      - name: Revalidate unsigned draft immediately before AMO
        env:
          EXPECTED_RELEASE_DATABASE_ID: ${{ needs.validate.outputs.release_database_id }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/pin-op-signing-unsigned"
          RELEASE_JSON="$RUNNER_TEMP/pin-op-signing-unsigned.json"
          node release-bundle/tools/verify-release-assets.mjs unsigned \
            "$RELEASE_JSON" \
            "$RELEASE_VERSION" \
            "$RELEASE_DIR/SHA256SUMS" \
            --expected-database-id "$EXPECTED_RELEASE_DATABASE_ID" \
            --compare-all release-bundle/artifacts
          (cd "$RELEASE_DIR" && sha256sum --check --strict SHA256SUMS)

      - name: Fetch prior signing run metadata
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          RUN_JSON="$RUNNER_TEMP/pin-op-resume-run.json"
          test ! -e "$RUN_JSON"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}" > "$RUN_JSON"

      - name: Restore prior AMO upload state
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.artifact_names.outputs.resume_amo_state_artifact_name }}
          path: extensions/firefox
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Validate restored AMO upload state and provenance
        if: inputs.resume_run_id != ''
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.release_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          node tools/amo-signing-state.mjs validate-resume \
            extensions/firefox/.amo-upload-uuid \
            extensions/firefox/.amo-upload-provenance.json \
            "$RUNNER_TEMP/pin-op-resume-run.json" \
            "$GITHUB_REPOSITORY" \
            ".github/workflows/firefox-sign.yml" \
            "workflow_dispatch" \
            "$RELEASE_TAG" \
            "$RELEASE_COMMIT" \
            "$RESUME_RUN_ID"
          rm -- extensions/firefox/.amo-upload-provenance.json

      - name: Verify initial signing has no prior AMO upload state
        if: inputs.resume_run_id == ''
        run: |
          test ! -e extensions/firefox/.amo-upload-uuid
          test ! -e extensions/firefox/.amo-upload-provenance.json

      - name: Check environment secrets and sign unlisted Firefox XPI
        id: amo_sign
        working-directory: extensions/firefox
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          FIREFOX_SOURCE_BASENAME: ${{ needs.validate.outputs.firefox_source_basename }}
        run: |
          set -euo pipefail
          if [[ -z "${WEB_EXT_API_KEY:-}" || -z "${WEB_EXT_API_SECRET:-}" ]]; then
            echo "::error::AMO signing credentials are not configured" >&2
            exit 1
          fi
          test ! -e ../../artifacts/firefox-signed
          mkdir ../../artifacts/firefox-signed
          corepack pnpm exec web-ext sign \
            --channel=unlisted \
            --source-dir=. \
            --artifacts-dir=../../artifacts/firefox-signed \
            --upload-source-code="../../release-bundle/artifacts/$FIREFOX_SOURCE_BASENAME" \
            --ignore-files package.json pnpm-lock.yaml tsconfig.json esbuild.mjs "src/**" "test/**" \
            --no-config-discovery \
            --no-input \
            --approval-timeout=900000 \
            --timeout=900000

      - name: Prepare available AMO upload state for preservation
        if: always() && steps.amo_sign.outcome != 'skipped'
        id: preserve_state
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AMO_STATE_DIRECTORY_NAME: ${{ steps.artifact_names.outputs.amo_state_directory_name }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.release_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          STATE_DIRECTORY="$RUNNER_TEMP/$AMO_STATE_DIRECTORY_NAME"
          test ! -e "$STATE_DIRECTORY"
          node tools/amo-signing-state.mjs preserve-bundle \
            extensions/firefox/.amo-upload-uuid \
            "$STATE_DIRECTORY" \
            "$GITHUB_REPOSITORY" \
            ".github/workflows/firefox-sign.yml" \
            "workflow_dispatch" \
            "$RELEASE_TAG" \
            "$RELEASE_COMMIT" \
            "$WORKFLOW_COMMIT" \
            "$CURRENT_RUN_ID"

      - name: Preserve available AMO upload state
        if: always() && steps.preserve_state.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact_names.outputs.amo_state_artifact_name }}
          path: ${{ runner.temp }}/${{ steps.artifact_names.outputs.amo_state_directory_name }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Normalize and verify the single signed artifact
        env:
          FIREFOX_XPI_BASENAME: ${{ needs.validate.outputs.firefox_xpi_basename }}
          FIREFOX_ZIP_BASENAME: ${{ needs.validate.outputs.firefox_zip_basename }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' -t XPI_FILES < <(find artifacts/firefox-signed -maxdepth 1 -type f -name '*.xpi' -print0)
          test "${#XPI_FILES[@]}" -eq 1
          SIGNED_XPI="artifacts/$FIREFOX_XPI_BASENAME"
          test ! -e "$SIGNED_XPI"
          mv -- "${XPI_FILES[0]}" "$SIGNED_XPI"
          node tools/verify-signed-firefox.mjs \
            "release-bundle/artifacts/$FIREFOX_ZIP_BASENAME" \
            "$SIGNED_XPI" \
            "$RELEASE_VERSION" \
            "info@conus.vision"

      - name: Create immutable signed XPI provenance
        id: provenance
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.release_commit }}
          RELEASE_DATABASE_ID: ${{ needs.validate.outputs.release_database_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SIGNED_PROVENANCE_ARTIFACT_NAME: ${{ steps.artifact_names.outputs.signed_provenance_artifact_name }}
          SIGNED_PROVENANCE_DIRECTORY_NAME: ${{ steps.artifact_names.outputs.signed_provenance_directory_name }}
          SIGNED_XPI_BASENAME: ${{ needs.validate.outputs.firefox_xpi_basename }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          PROVENANCE_DIR="$RUNNER_TEMP/$SIGNED_PROVENANCE_DIRECTORY_NAME"
          XPI_SHA256="$(node tools/release-signing-provenance.mjs create-bundle \
            "artifacts/$SIGNED_XPI_BASENAME" \
            "$PROVENANCE_DIR" \
            "$GITHUB_REPOSITORY" \
            ".github/workflows/firefox-sign.yml" \
            "workflow_dispatch" \
            "$RELEASE_TAG" \
            "$RELEASE_COMMIT" \
            "$WORKFLOW_COMMIT" \
            "$CURRENT_RUN_ID" \
            "$RELEASE_DATABASE_ID")"
          printf 'artifact_name=%s\n' "$SIGNED_PROVENANCE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          printf 'xpi_sha256=%s\n' "$XPI_SHA256" >> "$GITHUB_OUTPUT"
          printf 'Signed XPI run ID: `%s`\n\nXPI SHA-256: `%s`\n' \
            "$CURRENT_RUN_ID" "$XPI_SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve immutable signed XPI provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact_names.outputs.signed_provenance_artifact_name }}
          path: ${{ runner.temp }}/${{ steps.artifact_names.outputs.signed_provenance_directory_name }}/
          if-no-files-found: error
          retention-days: 90

  attach:
    needs:
      - validate
      - sign
    if: ${{ always() && needs.validate.result == 'success' && needs.sign.result == 'success' && inputs.mode == 'sign' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: amo-signing
    permissions:
      actions: read
      contents: write
    env:
      SIGNED_XPI_BASENAME: ${{ needs.validate.outputs.firefox_xpi_basename }}
      SIGNED_XPI_PROVENANCE_DIRECTORY: signed-xpi-provenance

    steps:
      - name: Restore verified unsigned release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.unsigned_artifact_name }}
          path: release-bundle

      - name: Restore immutable signed XPI provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sign.outputs.signed_artifact_name }}
          path: ${{ env.SIGNED_XPI_PROVENANCE_DIRECTORY }}

      - name: Validate current signed XPI provenance
        id: provenance
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.release_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          RELEASE_DATABASE_ID="$(node release-bundle/tools/release-signing-provenance.mjs validate-current \
            "$SIGNED_XPI_PROVENANCE_DIRECTORY" \
            "$GITHUB_REPOSITORY" \
            ".github/workflows/firefox-sign.yml" \
            "workflow_dispatch" \
            "$RELEASE_TAG" \
            "$RELEASE_COMMIT" \
            "$WORKFLOW_COMMIT" \
            "$CURRENT_RUN_ID")"
          test "$RELEASE_DATABASE_ID" = "${{ needs.validate.outputs.release_database_id }}"
          printf 'release_database_id=%s\n' "$RELEASE_DATABASE_ID" >> "$GITHUB_OUTPUT"

      - name: Redownload unsigned draft immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/pin-op-attach-unsigned"
          RELEASE_JSON="$RUNNER_TEMP/pin-op-attach-unsigned.json"
          test ! -e "$RELEASE_DIR"
          test ! -e "$RELEASE_JSON"
          mkdir "$RELEASE_DIR"
          gh release download "$RELEASE_TAG" --dir "$RELEASE_DIR"
          gh release view "$RELEASE_TAG" --json databaseId,isDraft,assets > "$RELEASE_JSON"

      - name: Revalidate unsigned draft immediately before upload
        env:
          EXPECTED_RELEASE_DATABASE_ID: ${{ steps.provenance.outputs.release_database_id }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/pin-op-attach-unsigned"
          RELEASE_JSON="$RUNNER_TEMP/pin-op-attach-unsigned.json"
          node release-bundle/tools/verify-release-assets.mjs unsigned \
            "$RELEASE_JSON" \
            "$RELEASE_VERSION" \
            "$RELEASE_DIR/SHA256SUMS" \
            --expected-database-id "$EXPECTED_RELEASE_DATABASE_ID" \
            --compare-all release-bundle/artifacts
          (cd "$RELEASE_DIR" && sha256sum --check --strict SHA256SUMS)

      - name: Prepare exact signed release assets
        run: |
          set -euo pipefail
          cp -- "$SIGNED_XPI_PROVENANCE_DIRECTORY/$SIGNED_XPI_BASENAME" release-bundle/artifacts/
          node release-bundle/tools/write-checksums.mjs release-bundle/artifacts

      - name: Upload signed XPI to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "release-bundle/artifacts/$SIGNED_XPI_BASENAME" \
            release-bundle/artifacts/SHA256SUMS \
            --clobber

      - name: Download signed draft after upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/pin-op-attach-signed"
          RELEASE_JSON="$RUNNER_TEMP/pin-op-attach-signed.json"
          test ! -e "$RELEASE_DIR"
          test ! -e "$RELEASE_JSON"
          mkdir "$RELEASE_DIR"
          gh release download "$RELEASE_TAG" --dir "$RELEASE_DIR"
          gh release view "$RELEASE_TAG" --json databaseId,isDraft,assets > "$RELEASE_JSON"

      - name: Verify exact signed draft after upload
        env:
          EXPECTED_RELEASE_DATABASE_ID: ${{ steps.provenance.outputs.release_database_id }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/pin-op-attach-signed"
          RELEASE_JSON="$RUNNER_TEMP/pin-op-attach-signed.json"
          node release-bundle/tools/verify-release-assets.mjs signed \
            "$RELEASE_JSON" \
            "$RELEASE_VERSION" \
            "$RELEASE_DIR/SHA256SUMS" \
            --expected-database-id "$EXPECTED_RELEASE_DATABASE_ID" \
            --compare-all release-bundle/artifacts
          (cd "$RELEASE_DIR" && sha256sum --check --strict SHA256SUMS)
          cmp -- \
            "$RELEASE_DIR/$SIGNED_XPI_BASENAME" \
            "$SIGNED_XPI_PROVENANCE_DIRECTORY/$SIGNED_XPI_BASENAME"

  publish:
    needs: validate
    if: ${{ needs.validate.result == 'success' && inputs.mode == 'publish' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: amo-signing
    permissions:
      actions: read
      contents: write
    env:
      CHROME_BASENAME: ${{ needs.validate.outputs.chrome_basename }}
      FIREFOX_SOURCE_BASENAME: ${{ needs.validate.outputs.firefox_source_basename }}
      FIREFOX_XPI_BASENAME: ${{ needs.validate.outputs.firefox_xpi_basename }}
      FIREFOX_ZIP_BASENAME: ${{ needs.validate.outputs.firefox_zip_basename }}
      SIGNED_XPI_PROVENANCE_DIRECTORY: signed-xpi-provenance
      VSCODE_BASENAME: ${{ needs.validate.outputs.vscode_basename }}

    steps:
      - name: Restore verified unsigned release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.unsigned_artifact_name }}
          path: release-bundle

      - name: Define publication artifact handoffs
        id: artifact_names
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SIGN_RUN_ID: ${{ inputs.sign_run_id }}
        run: |
          set -euo pipefail
          SIGNED_PROVENANCE_ARTIFACT_NAME="$(node \
            release-bundle/tools/release-signing-provenance.mjs artifact-name \
            "$RELEASE_TAG" "$SIGN_RUN_ID")"
          printf 'signed_provenance_artifact_name=%s\n' \
            "$SIGNED_PROVENANCE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Fetch trusted signing run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SIGN_RUN_ID: ${{ inputs.sign_run_id }}
        run: |
          set -euo pipefail
          RUN_JSON="$RUNNER_TEMP/pin-op-sign-run.json"
          test ! -e "$RUN_JSON"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${SIGN_RUN_ID}" > "$RUN_JSON"

      - name: Restore immutable signed XPI provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.artifact_names.outputs.signed_provenance_artifact_name }}
          path: ${{ env.SIGNED_XPI_PROVENANCE_DIRECTORY }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.sign_run_id }}

      - name: Validate exact manually verified signed XPI
        id: provenance
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.release_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          SIGN_RUN_ID: ${{ inputs.sign_run_id }}
          VERIFIED_XPI_SHA256: ${{ inputs.verified_xpi_sha256 }}
        run: |
          set -euo pipefail
          RELEASE_DATABASE_ID="$(node release-bundle/tools/release-signing-provenance.mjs validate-publish \
            "$SIGNED_XPI_PROVENANCE_DIRECTORY" \
            "$RUNNER_TEMP/pin-op-sign-run.json" \
            "$GITHUB_REPOSITORY" \
            ".github/workflows/firefox-sign.yml" \
            "workflow_dispatch" \
            "$RELEASE_TAG" \
            "$RELEASE_COMMIT" \
            "$SIGN_RUN_ID" \
            "$VERIFIED_XPI_SHA256")"
          test "$RELEASE_DATABASE_ID" = "${{ needs.validate.outputs.release_database_id }}"
          printf 'release_database_id=%s\n' "$RELEASE_DATABASE_ID" >> "$GITHUB_OUTPUT"

      - name: Download signed draft for publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/pin-op-publish-initial"
          RELEASE_JSON="$RUNNER_TEMP/pin-op-publish-initial.json"
          test ! -e "$RELEASE_DIR"
          test ! -e "$RELEASE_JSON"
          mkdir "$RELEASE_DIR"
          gh release download "$RELEASE_TAG" --dir "$RELEASE_DIR"
          gh release view "$RELEASE_TAG" --json databaseId,isDraft,assets > "$RELEASE_JSON"

      - name: Verify signed draft identity for publication
        env:
          EXPECTED_RELEASE_DATABASE_ID: ${{ steps.provenance.outputs.release_database_id }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/pin-op-publish-initial"
          RELEASE_JSON="$RUNNER_TEMP/pin-op-publish-initial.json"
          node release-bundle/tools/verify-release-assets.mjs signed \
            "$RELEASE_JSON" \
            "$RELEASE_VERSION" \
            "$RELEASE_DIR/SHA256SUMS" \
            --expected-database-id "$EXPECTED_RELEASE_DATABASE_ID" \
            --compare-unsigned-artifacts release-bundle/artifacts
          (cd "$RELEASE_DIR" && sha256sum --check --strict SHA256SUMS)
          cmp -- \
            "$RELEASE_DIR/$FIREFOX_XPI_BASENAME" \
            "$SIGNED_XPI_PROVENANCE_DIRECTORY/$FIREFOX_XPI_BASENAME"

      - name: Verify and publish immutable release by ID
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_RELEASE_DATABASE_ID: ${{ steps.provenance.outputs.release_database_id }}
          EXPECTED_RELEASE_TARGET: master
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          VERIFIED_XPI_SHA256: ${{ inputs.verified_xpi_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE_DATABASE_ID" =~ ^[1-9][0-9]*$ ]]

          BEFORE_JSON="$RUNNER_TEMP/pin-op-publication-before.json"
          PATCH_JSON="$RUNNER_TEMP/pin-op-publication-after-patch.json"
          AFTER_JSON="$RUNNER_TEMP/pin-op-publication-after.json"
          BEFORE_FINGERPRINT="$RUNNER_TEMP/pin-op-publication-before.fingerprint.json"
          PATCH_FINGERPRINT="$RUNNER_TEMP/pin-op-publication-after-patch.fingerprint.json"
          AFTER_FINGERPRINT="$RUNNER_TEMP/pin-op-publication-after.fingerprint.json"
          BEFORE_CHECKSUM_FINGERPRINT="$RUNNER_TEMP/pin-op-publication-before.checksums.json"
          AFTER_CHECKSUM_FINGERPRINT="$RUNNER_TEMP/pin-op-publication-after.checksums.json"
          BEFORE_DIR="$RUNNER_TEMP/pin-op-publication-before-assets"
          AFTER_DIR="$RUNNER_TEMP/pin-op-publication-after-assets"
          for PATH_TO_CREATE in \
            "$BEFORE_JSON" \
            "$PATCH_JSON" \
            "$AFTER_JSON" \
            "$BEFORE_FINGERPRINT" \
            "$PATCH_FINGERPRINT" \
            "$AFTER_FINGERPRINT" \
            "$BEFORE_CHECKSUM_FINGERPRINT" \
            "$AFTER_CHECKSUM_FINGERPRINT" \
            "$BEFORE_DIR" \
            "$AFTER_DIR"; do
            test ! -e "$PATH_TO_CREATE"
          done
          mkdir "$BEFORE_DIR" "$AFTER_DIR"

          ASSET_NAMES=(
            "$CHROME_BASENAME"
            "$FIREFOX_ZIP_BASENAME"
            "$FIREFOX_XPI_BASENAME"
            "$FIREFOX_SOURCE_BASENAME"
            "$VSCODE_BASENAME"
            "SHA256SUMS"
          )

          download_release_assets() {
            local release_json="$1"
            local destination="$2"
            local asset_name
            local asset_id
            for asset_name in "${ASSET_NAMES[@]}"; do
              asset_id="$(jq -er --arg name "$asset_name" \
                '.assets[] | select(.name == $name) | .id' "$release_json")"
              [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
              gh api --method GET \
                -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                > "$destination/$asset_name"
            done
          }

          gh api --method GET "repos/${GITHUB_REPOSITORY}/releases/${EXPECTED_RELEASE_DATABASE_ID}" > "$BEFORE_JSON"
          env -u GH_TOKEN node release-bundle/tools/verify-release-publication.mjs draft \
            "$BEFORE_JSON" \
            "$RELEASE_VERSION" \
            "$EXPECTED_RELEASE_DATABASE_ID" \
            "$RELEASE_TAG" \
            "$EXPECTED_RELEASE_TARGET" \
            > "$BEFORE_FINGERPRINT"
          download_release_assets "$BEFORE_JSON" "$BEFORE_DIR"
          env -u GH_TOKEN node release-bundle/tools/verify-publication-checksums.mjs \
            "$BEFORE_DIR" "$RELEASE_VERSION" \
            > "$BEFORE_CHECKSUM_FINGERPRINT"
          (cd "$BEFORE_DIR" && sha256sum --check --strict SHA256SUMS)
          cmp -- "$BEFORE_DIR/$CHROME_BASENAME" \
            "release-bundle/artifacts/$CHROME_BASENAME"
          cmp -- "$BEFORE_DIR/$FIREFOX_ZIP_BASENAME" \
            "release-bundle/artifacts/$FIREFOX_ZIP_BASENAME"
          cmp -- "$BEFORE_DIR/$FIREFOX_SOURCE_BASENAME" \
            "release-bundle/artifacts/$FIREFOX_SOURCE_BASENAME"
          cmp -- "$BEFORE_DIR/$VSCODE_BASENAME" \
            "release-bundle/artifacts/$VSCODE_BASENAME"
          cmp -- "$BEFORE_DIR/$FIREFOX_XPI_BASENAME" \
            "$SIGNED_XPI_PROVENANCE_DIRECTORY/$FIREFOX_XPI_BASENAME"
          test "$(sha256sum "$BEFORE_DIR/$FIREFOX_XPI_BASENAME" | cut -d ' ' -f 1)" = \
            "$VERIFIED_XPI_SHA256"

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${EXPECTED_RELEASE_DATABASE_ID}" \
            -F draft=false > "$PATCH_JSON"
          env -u GH_TOKEN node release-bundle/tools/verify-release-publication.mjs published \
            "$PATCH_JSON" \
            "$RELEASE_VERSION" \
            "$EXPECTED_RELEASE_DATABASE_ID" \
            "$RELEASE_TAG" \
            "$EXPECTED_RELEASE_TARGET" \
            > "$PATCH_FINGERPRINT"

          gh api --method GET "repos/${GITHUB_REPOSITORY}/releases/${EXPECTED_RELEASE_DATABASE_ID}" > "$AFTER_JSON"
          env -u GH_TOKEN node release-bundle/tools/verify-release-publication.mjs published \
            "$AFTER_JSON" \
            "$RELEASE_VERSION" \
            "$EXPECTED_RELEASE_DATABASE_ID" \
            "$RELEASE_TAG" \
            "$EXPECTED_RELEASE_TARGET" \
            > "$AFTER_FINGERPRINT"
          cmp -- \
            "$RUNNER_TEMP/pin-op-publication-before.fingerprint.json" \
            "$RUNNER_TEMP/pin-op-publication-after-patch.fingerprint.json"
          cmp -- \
            "$RUNNER_TEMP/pin-op-publication-before.fingerprint.json" \
            "$RUNNER_TEMP/pin-op-publication-after.fingerprint.json"

          download_release_assets "$AFTER_JSON" "$AFTER_DIR"
          env -u GH_TOKEN node release-bundle/tools/verify-publication-checksums.mjs \
            "$AFTER_DIR" "$RELEASE_VERSION" \
            > "$AFTER_CHECKSUM_FINGERPRINT"
          (cd "$AFTER_DIR" && sha256sum --check --strict SHA256SUMS)
          for asset_name in "${ASSET_NAMES[@]}"; do
            cmp -- "$BEFORE_DIR/$asset_name" "$AFTER_DIR/$asset_name"
          done
          cmp -- \
            "$RUNNER_TEMP/pin-op-publication-before.checksums.json" \
            "$RUNNER_TEMP/pin-op-publication-after.checksums.json"
