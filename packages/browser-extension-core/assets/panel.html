<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser2IDE</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <header class="panel-header">
      <div class="brand">
        <img src="./browser2ide.svg" alt="" width="20" height="20" />
        <h1>Browser2IDE</h1>
      </div>
      <div class="connection-summary">
        <output id="connection-status" class="status" data-state="notLinked">
          Not linked
        </output>
        <output id="linked-code" class="linked-code" hidden></output>
        <button
          id="disconnect-button"
          class="disconnect-button"
          type="button"
          hidden
        >
          Disconnect
        </button>
      </div>
    </header>

    <main class="panel-layout">
      <div class="connection-zone">
        <section id="link-controls" class="connection" aria-label="IDE link">
          <form id="link-form" class="link-form">
            <label class="field" for="link-code">VS Code window code</label>
            <div class="link-row">
              <input
                id="link-code"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                maxlength="9"
                spellcheck="false"
              />
              <button
                id="paste-button"
                class="icon-button"
                type="button"
                aria-label="Paste link code"
                title="Paste link code"
              >
                <i data-lucide="clipboard-paste" aria-hidden="true"></i>
              </button>
              <button id="link-button" class="primary-button" type="submit" disabled>
                Link
              </button>
            </div>
          </form>
        </section>
      </div>

      <section class="inspect-toolbar" aria-label="Inspect mode">
        <button
          id="inspect-mode"
          class="icon-button picker-button"
          type="button"
          aria-label="Select an element"
          aria-pressed="false"
          title="Select an element"
          disabled
        >
          <i data-lucide="mouse-pointer-2" aria-hidden="true"></i>
        </button>
      </section>

      <section class="dom-tree-section" aria-label="Document structure">
        <div id="dom-tree" class="dom-tree" role="tree" aria-label="DOM tree">
          <div
            id="dom-tree-spacer"
            class="dom-tree-spacer"
            role="presentation"
          ></div>
        </div>
        <div id="dom-tree-empty" class="dom-tree-empty">No document</div>
      </section>

      <footer class="panel-footer">
        <output
          id="selected-element-summary"
          class="selected-element-summary"
          hidden
        ></output>
        <div class="resolution-row">
          <output id="resolution-status" class="resolution-status" role="status">Select an element to inspect</output>
          <div id="source-navigation-footer" class="source-navigation-footer" hidden>
            <output id="source-navigation-counter"></output>
            <button id="source-previous" class="source-navigation-button" type="button" aria-label="Previous source match" title="Previous source match"></button>
            <button id="source-next" class="source-navigation-button" type="button" aria-label="Next source match" title="Next source match"></button>
          </div>
        </div>
        <output id="panel-error" class="panel-error" role="status" hidden></output>
      </footer>
    </main>

    <script src="./panel.js"></script>
  </body>
</html>
